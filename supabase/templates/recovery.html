<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your COMPARTS password</title></head>
<body style="margin:0;padding:32px 16px;background:#f5f7fb;font-family:Arial,sans-serif;color:#182a43">
  <main style="max-width:480px;margin:auto;padding:32px;background:#fff;border-radius:16px">
    <p style="font-weight:bold;color:#205be0">COMPARTS</p>
    <h1 style="font-size:24px">Reset your password</h1>
    <p>Enter this code in the COMPARTS app. After verification, choose a new password:</p>
    <p style="padding:20px;background:#eaf0ff;text-align:center;font-size:32px;font-weight:bold;letter-spacing:8px">{{ .Token }}</p>
    <p>This code can be used once and expires shortly. Never share it with anyone.</p>
    <p style="font-size:12px;color:#64748b">If you did not request a password reset, ignore this email. Your password has not been changed.</p>
  </main>
</body>
</html>
